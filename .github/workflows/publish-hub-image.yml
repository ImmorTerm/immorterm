name: Publish Session Bridge Hub image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".devops/docker/Dockerfile.hub"
      - ".github/workflows/publish-hub-image.yml"
      - "services/hub/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-session-bridge-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the exact main commit
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/docker/Dockerfile.hub
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/immorterm/immorterm-hub:main-${{ github.sha }}
            ghcr.io/immorterm/immorterm-hub:main
          cache-from: type=gha,scope=immorterm-hub
          cache-to: type=gha,mode=max,scope=immorterm-hub
          provenance: mode=max
          sbom: true
